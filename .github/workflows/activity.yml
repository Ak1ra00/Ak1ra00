# Redraws the btop-style activity panel from live contribution data and
# publishes it to the `output` branch as a single force-pushed commit, so the
# history of main (and the owner's contribution graph) never fills with bot
# commits. The README loads output/activity-{dark,light}.svg.

name: activity

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Draw the panel from live contribution data
        run: python3 tools/activity.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-dark.svg activity-light.svg
          git commit -q -m "activity: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:output
